<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 960" width="700" height="960">
  <defs>
    <radialGradient id="bg_echoes-of-nova-prime" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1a47"/>
      <stop offset="65%" stop-color="#0a081c"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <filter id="shadow_echoes-of-nova-prime" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="24" dy="32" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="coverFace_echoes-of-nova-prime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a081c"/>
      <stop offset="40%" stop-color="#1e1a47"/>
      <stop offset="100%" stop-color="#0a081c"/>
    </linearGradient>

    <linearGradient id="spineShade_echoes-of-nova-prime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020204" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#1e1a47" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0a081c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="goldAccent_echoes-of-nova-prime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>

    <linearGradient id="pageGrad_echoes-of-nova-prime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="50%" stop-color="#dfd3be"/>
      <stop offset="100%" stop-color="#c4b59d"/>
    </linearGradient>
  </defs>

  <!-- Studio Ambient Surface -->
  <rect width="100%" height="100%" fill="url(#bg_echoes-of-nova-prime)"/>
  <ellipse cx="350" cy="850" rx="270" ry="55" fill="#000000" fill-opacity="0.6" filter="blur(20px)"/>

  <!-- 3D HARDCOVER BOOK -->
  <g transform="translate(60, 45)" filter="url(#shadow_echoes-of-nova-prime)">
    <!-- Right Page Block -->
    <polygon points="520,38 544,24 544,820 520,836" fill="url(#pageGrad_echoes-of-nova-prime)"/>
    <path d="M526,34 L526,832 M532,30 L532,828 M538,27 L538,824 M542,25 L542,821" stroke="#96856c" stroke-width="0.6" stroke-opacity="0.5"/>

    <!-- Top Page Block -->
    <polygon points="48,24 520,38 544,24 72,10" fill="#ebdcc8"/>

    <!-- Left 3D Spine -->
    <polygon points="20,16 48,24 48,844 20,836" fill="url(#spineShade_echoes-of-nova-prime)"/>
    <line x1="20" y1="16" x2="20" y2="836" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="48" y1="24" x2="48" y2="844" stroke="#000000" stroke-opacity="0.7" stroke-width="2"/>
    
    <!-- Spine Vertical Title -->
    <g transform="translate(34, 430) rotate(-90)">
      <text font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.24em" text-anchor="middle">
        ECHOES OF NOVA PRIME • TARIQ VANCE
      </text>
    </g>

    <!-- Front Cover Face -->
    <polygon points="48,24 520,38 520,858 48,844" fill="url(#coverFace_echoes-of-nova-prime)"/>

    <!-- Precision Filigree Frame -->
    <rect x="72" y="50" width="426" height="782" fill="none" stroke="url(#goldAccent_echoes-of-nova-prime)" stroke-width="1.5" stroke-opacity="0.6" rx="6"/>
    <rect x="80" y="58" width="410" height="766" fill="none" stroke="#c7d2fe" stroke-width="0.6" stroke-opacity="0.25" rx="3"/>

    <!-- Top Genre / Edition Badge -->
    <g transform="translate(284, 90)">
      <text font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="0.3em">
        ★ GALAXY SCI-FI AWARD WINNER ★
      </text>
      <line x1="-140" y1="14" x2="140" y2="14" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4"/>
    </g>

    <!-- Praise Hook -->
    <g transform="translate(284, 138)">
      <text font-family="'Playfair Display', Georgia, serif" font-size="11" font-style="italic" fill="#f1f5f9" text-anchor="middle">
        “Riveting cosmic scale grounded in rigorous astrophysics.”
      </text>
    </g>

    <!-- Center Art Emblem -->
    <g transform="translate(284, 285)">
      <circle cx="0" cy="0" r="85" fill="#0a081c" fill-opacity="0.85" stroke="url(#goldAccent_echoes-of-nova-prime)" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="5,4" stroke-opacity="0.5"/>
      <polygon points="0,-58 58,0 0,58 -58,0" fill="none" stroke="url(#goldAccent_echoes-of-nova-prime)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="#818cf8" fill-opacity="0.9"/>
    </g>

    <!-- Book Title -->
    <g transform="translate(284, 465)">
      <text font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">
        Echoes of Nova Prime
      </text>
      <text font-family="'DM Sans', sans-serif" font-size="13" font-style="italic" fill="#c7d2fe" text-anchor="middle" y="42">
        Deep-Space Exploration & Ancient Relics
      </text>
    </g>

    <!-- Author Block -->
    <g transform="translate(284, 690)">
      <line x1="-120" y1="-20" x2="120" y2="-20" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4"/>
      <text font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="0.25em">
        HARD SCIENCE FICTION BY
      </text>
      <text font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" y="28">
        Tariq Vance
      </text>
      <text font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.12em" y="48">
        Hard Science Fiction
      </text>
    </g>

    <!-- Publisher Seal -->
    <g transform="translate(284, 804)">
      <circle cx="0" cy="0" r="12" fill="#0a081c" stroke="#818cf8" stroke-width="1"/>
      <text font-family="'DM Sans', sans-serif" font-size="7" font-weight="800" fill="#818cf8" text-anchor="middle" y="2.5">ED</text>
      <text font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2em" y="15">
        COLLECTORS EDITORIAL PRESS
      </text>
    </g>
  </g>
</svg>