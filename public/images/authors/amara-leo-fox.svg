  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5" rx="20"/>
  <rect x="36" y="36" width="528" height="678" fill="none" stroke="#fb923c" stroke-opacity="0.12" stroke-width="1" rx="16"/>

