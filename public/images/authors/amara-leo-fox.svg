    <circle cx="0" cy="0" r="130" fill="#221104" stroke="#fb923c" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.3"/>
    
    <!-- Stylized Monogram Silhouette -->
