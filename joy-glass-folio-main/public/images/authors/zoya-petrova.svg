      <stop offset="0%" stop-color="#4c1d42"/>
      <stop offset="60%" stop-color="#3f1236"/>
      <stop offset="100%" stop-color="#22051c"/>
    </radialGradient>
    <radialGradient id="authorGlow_zoya-petrova" cx="50%" cy="36%" r="40%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="authorShadow_zoya-petrova" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#authorBg_zoya-petrova)"/>
  <rect width="100%" height="100%" fill="url(#authorGlow_zoya-petrova)"/>

  <!-- Outer Architectural Framing -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5" rx="20"/>
  <rect x="36" y="36" width="528" height="678" fill="none" stroke="#f43f5e" stroke-opacity="0.12" stroke-width="1" rx="16"/>

  <!-- Center Portrait Frame -->
  <g transform="translate(300, 260)" filter="url(#authorShadow_zoya-petrova)">
    <circle cx="0" cy="0" r="130" fill="#22051c" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="5,4" stroke-opacity="0.3"/>
    
    <!-- Stylized Monogram Silhouette -->
    <circle cx="0" cy="-28" r="48" fill="#f43f5e" fill-opacity="0.9"/>
    <path d="M -70,75 C -70,12 -35,6 0,6 C 35,6 70,12 70,75 Z" fill="#f43f5e" fill-opacity="0.85"/>
    <text x="0" y="8" font-family="'DM Sans', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#22051c" text-anchor="middle" letter-spacing="0.08em">
      ZP
    </text>
  </g>

  <!-- Author Identification Card -->
  <g transform="translate(300, 520)">
    <rect x="-240" y="-15" width="480" height="175" rx="18" fill="#22051c" fill-opacity="0.85" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="0" y="32" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">
